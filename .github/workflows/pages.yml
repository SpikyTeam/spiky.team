name: pages

# Builds spiky.team from the landing source in SpikyMC-Sites: on a timer, after
# a change there, and by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SpikyTeam/SpikyMC-Sites
          token: ${{ secrets.PUBLISH_TOKEN }}
          path: src
          sparse-checkout: spiky

      - uses: actions/configure-pages@v5

      - name: Assemble
        run: |
          mkdir -p out
          cp -a src/spiky/. out/
          # .nojekyll keeps Pages from running Jekyll over files it would skip
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
